name: Release Mod Package

on:
  push:
    branches: [main]
    paths: [mod_info.lua]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.66); blank increments mod_info.lua by 0.01'
        type: string
        default: ''
      bump:
        description: 'Bump and commit mod_info.lua (disable to package its current version)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      bump:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: quiet-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare version and verify release ZIP
        id: package
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUMP_VERSION: ${{ inputs.bump || false }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          ./.github/scripts/release.ps1 -OutputDirectory "$env:RUNNER_TEMP/quiet-release" `
            -Version $env:REQUESTED_VERSION -Bump:($env:BUMP_VERSION -eq 'true') `
            -Before $env:PUSH_BEFORE

      - name: Push the version commit and release tag
        if: steps.package.outputs.should_release == 'true'
        run: |
          ./.github/scripts/release.ps1 -OutputDirectory "$env:RUNNER_TEMP/quiet-release" -PublishRefs

      - name: Publish GitHub Release
        if: steps.package.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ steps.package.outputs.sha }}
          name: ${{ steps.package.outputs.tag }}
          body_path: ${{ steps.package.outputs.release_body }}
          files: ${{ steps.package.outputs.archive_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
